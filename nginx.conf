events {}

http {
  include /etc/nginx/mime.types;

  server {
    listen 80;
    server_name pedacodeceu.local;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    server_name pedacodeceu.local;

    client_max_body_size 5M;

    ssl_certificate /etc/nginx/certs/pedacodeceu.local.pem;
    ssl_certificate_key /etc/nginx/certs/pedacodeceu.local-key.pem;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:;" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
      proxy_pass http://pedaco-front:80;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
      proxy_pass http://pedaco-back:3000/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Rotas internas do back (serviço -> serviço) não ficam expostas pelo site
    location /api/internal/ {
      return 404;
    }

    # Microsserviço de avaliações (FastAPI). Tem que vir antes de /api/ só por clareza:
    # o nginx escolhe o prefixo mais longo, então /api/avaliacoes ganha de /api/.
    location /api/avaliacoes {
      proxy_pass http://pedaco-avaliacoes:8000/avaliacoes;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger do serviço de avaliações. O Swagger UI carrega JS/CSS do cdn.jsdelivr.net,
    # então esta página precisa de uma CSP própria. (add_header aqui substitui os do server.)
    location /api/avaliacoes/docs {
      proxy_pass http://pedaco-avaliacoes:8000/avaliacoes/docs;
      proxy_set_header Host $host;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: https://fastapi.tiangolo.com;" always;
    }

    location /uploads/ {
      proxy_pass http://pedaco-back:3000/uploads/;
    }
  }
}