services:

  database:
    image: mysql:8.0
    container_name: mysql-db
    restart: always
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    container_name: redis-cache
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  backend:
    build:
      context: ./PedacodeCeu-Back
      dockerfile: Dockerfile
    container_name: pedaco-back
    restart: always
    env_file:
      - ./PedacodeCeu-Back/.env
    environment:
      DB_HOST: database
      DB_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "3000:3000"
    volumes:
      - ./PedacodeCeu-Back/uploads:/app/uploads
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network

  avaliacoes-db:
    image: postgres:16-alpine
    container_name: avaliacoes-db
    restart: always
    env_file:
      - ./PedacodeCeu-Avaliacoes/.env
    ports:
      - "5433:5432"
    volumes:
      - avaliacoes_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  avaliacoes:
    build:
      context: ./PedacodeCeu-Avaliacoes
      dockerfile: Dockerfile
    container_name: pedaco-avaliacoes
    restart: always
    env_file:
      - ./PedacodeCeu-Avaliacoes/.env
    environment:
      DB_HOST: avaliacoes-db
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      BACKEND_URL: http://pedaco-back:3000
    expose:
      - "8000"
    depends_on:
      avaliacoes-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/avaliacoes/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./PedacodeCeu-Front
      dockerfile: Dockerfile
    container_name: pedaco-front
    expose:
      - "80"
    depends_on:
      - backend
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "8080:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/certs:/etc/nginx/certs
    depends_on:
      - frontend
      - backend
      - avaliacoes
    networks:
      - app-network

volumes:
  db_data:
  redis_data:
  avaliacoes_data:

networks:
  app-network:
